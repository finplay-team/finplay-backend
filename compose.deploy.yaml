# 배포용 스택 — 웹 2대(롤링 배포)·스케줄러 1대 각 인스턴스에서 컨테이너 1개씩 띄운다.
# 프론트는 S3+CloudFront에서 독립 배포되므로 nginx 없이 앱만 띄운다 (ADR-0022 — 이슈 #108 A안·동일 오리진 서빙 폐기).
# 루트 compose.yaml은 로컬 개발 전용(spring-boot-docker-compose가 bootRun에서 자동 기동)이므로 건드리지 않는다.
# 2026-09-14: EC2에서 소스를 빌드하던 build: 블록을 걷어내고 ECR이 관리하는 이미지를 그대로 pull하는
# 방식으로 바꿨다(ADR-0021 §결정 4와 같은 이유 — blue/green이 서로 다른 빌드가 되는 문제를 다중 인스턴스
# 롤링 배포에서도 피해야 한다). 실행: docker compose -f compose.deploy.yaml up -d   (같은 디렉터리의 .env를 읽는다)
name: finplay-deploy

services:
  app:
    image: ${APP_IMAGE}
    # 배포 스크립트가 docker inspect·docker logs로 이 이름을 그대로 지목한다
    # (compose.bluegreen.yaml의 finplay-app-blue/green과 같은 이유).
    container_name: finplay-app
    # 시크릿·외부 연동 키는 .env에서 그대로 주입한다 (.env.example 참조). 값은 파일에 적지 않는다.
    # 뉴스·공시 수집과 AI 서술이 쓰는 NAVER_SEARCH_CLIENT_ID·NAVER_SEARCH_CLIENT_SECRET·DART_API_KEY·
    # OPENAI_API_KEY도 이 경로로만 들어온다 (spec 012 FEED-001). 아래 environment 블록에 다시 적지 않는다 —
    # environment가 env_file보다 우선하므로 여기 이름을 적으면 .env 값이 무시된다.
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 컨테이너에 TZ가 없으면 기반 이미지(eclipse-temurin) 기본값인 UTC로 JVM이 뜬다 — compose.bluegreen.yaml과
      # 같은 이유(이슈 #370, 9시간 어긋난 collected_at 실측)로 명시한다.
      TZ: Asia/Seoul
    # 런타임 이미지(eclipse-temurin:17-jre)는 Ubuntu 기반이라 curl이 이미 들어 있어 별도 설치 없이 쓴다.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      # 로컬 실측 기동 시간이 약 40초다. 그 사이 실패는 retries로 세지 않는다.
      start_period: 90s
    # 외부 진입점이 ALB로 바뀌면서 호스트 포트를 직접 연다 (ADR-0022 — nginx 제거로 대체).
    ports:
      - "8080:8080"
    restart: unless-stopped
    # 전환 순간 진행 중이던 요청을 끊지 않기 위한 graceful shutdown 여유 시간이다 —
    # application.yml의 server.shutdown: graceful 타임아웃보다 길게 잡는다(compose.bluegreen.yaml과 동일 원칙).
    stop_grace_period: 30s
    # 컨테이너 stdout/stderr을 CloudWatch Logs로 직접 보낸다 — 로그 그룹은 인스턴스마다 다르므로
    # (web-1/web-2/scheduler) .env의 AWSLOGS_GROUP으로 주입한다(refresh-env.sh가 매번 다시 써 넣음).
    # EC2 인스턴스 역할의 커스텀 정책이 인스턴스별 로그 그룹에 로그 스트림을 생성·전송할 권한을 갖고
    # 있어 Docker awslogs가 해당 권한으로 로그를 보낸다.
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-northeast-2
        awslogs-group: ${AWSLOGS_GROUP}
        awslogs-stream: app
        awslogs-create-group: "false"
