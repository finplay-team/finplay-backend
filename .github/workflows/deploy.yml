# dev 머지 시 롤링 배포를 수행하는 CD 파이프라인 (ADR-0021 원형, 2026-09-14 다중 인스턴스
# 전환으로 블루-그린 가중치 전환에서 롤링 배포로 재설계 — 상세 근거는 ai/adr/0030-rolling-deploy-multi-instance.md).
# 웹 2대는 한 대씩 ALB에서 빼고 배포하고 재등록한다(둘 다 항상 라이브라 blue/green 색 구분이 없다).
# 스케줄러 1대는 ALB에 없으므로 이미지만 교체한다.
name: Deploy

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "재배포할 커밋 SHA (비우면 현재 dev HEAD). workflow_dispatch는 반드시 dev 브랜치에서 실행한다 — OIDC 신뢰 정책이 ref:refs/heads/dev로 한정돼 있어 다른 브랜치에서 실행하면 AssumeRoleWithWebIdentity에서 막힌다."
        required: false

# 백엔드 push와 향후 다른 트리거가 겹치면 같은 인스턴스를 동시에 건드릴 수 있어 직렬화한다.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write # AWS OIDC
  contents: read

jobs:
  build:
    # EC2가 t4g.small(Graviton/arm64)이라 x86 러너에서 만든 이미지는 exec format error로 죽는다.
    runs-on: ubuntu-24.04-arm
    outputs:
      tag: ${{ steps.image.outputs.tag }}
      image: ${{ steps.image-lookup.outputs.image || steps.build-push.outputs.image }}
    steps:
      # image_tag는 이후 ECR 태그·SSM 원격 명령에 그대로 쓰인다 — checkout보다 먼저, 커밋 SHA
      # 형식인지부터 검증해 특수문자 섞인 입력이 원격 스크립트를 깨뜨리는 것을 막는다.
      - name: image_tag 입력 형식 검증
        if: inputs.image_tag != ''
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if ! [[ "$IMAGE_TAG" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::image_tag는 커밋 SHA(7~40자 소문자 hex) 형식만 허용한다: '$IMAGE_TAG'"
            exit 1
          fi

      # fetch-depth: 0 — 아래 마이그레이션 번호 역전 감지가 직전 dev 커밋(github.event.before)의
      # 트리를 읽어야 한다. 기본 얕은 클론은 커밋 1개뿐이라 그 커밋이 없다.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.image_tag || github.sha }}
          fetch-depth: 0

      # 이슈 #449 — ci.yml의 번호 역전 검사는 PR 시점의 origin/dev만 보므로, 그 뒤 다른 PR이 먼저
      # 머지되면 낮은 번호가 검사를 통과한 채로 들어올 수 있다. 이 스텝은 사후 감지다.
      - name: 마이그레이션 번호 역전 사후 감지 (이 푸시 직전 dev 최고 번호와 대조)
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          MIGRATION_DIR="src/main/resources/db/migration"

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "::notice::직전 dev 커밋($BEFORE)을 확인할 수 없어 번호 역전 감지를 건너뛴다"
            exit 0
          fi

          MAX_BEFORE=$(git ls-tree -r --name-only "$BEFORE" -- "$MIGRATION_DIR" | grep -oE '/V[0-9]+__' | grep -oE '[0-9]+' | sort -n | tail -1 || true)
          MAX_BEFORE=${MAX_BEFORE:-0}
          echo "직전 dev($BEFORE) 최고 마이그레이션 번호: V$MAX_BEFORE"

          NEW_FILES=$(git diff --name-only --diff-filter=AR "$BEFORE" "$GITHUB_SHA" -- "$MIGRATION_DIR" || true)
          if [ -z "$NEW_FILES" ]; then
            echo "이 푸시가 추가한 신규 마이그레이션 없음 — 통과"
            exit 0
          fi

          INVERTED=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            NUM=$(basename "$f" | grep -oE '^V[0-9]+' | grep -oE '[0-9]+' || true)
            if [ -z "$NUM" ]; then
              echo "번호 없는 파일 — 검사 대상 아님: $f"
              continue
            fi
            echo "이 푸시가 추가한 마이그레이션: $f (V$NUM)"
            if [ "$NUM" -le "$MAX_BEFORE" ]; then
              echo "::error file=$f::V$NUM이 직전 dev 최고 번호(V$MAX_BEFORE) 이하다 — 이 상태로 배포하면 Flyway가 validate에서 'Detected resolved migration not applied to database: $NUM'으로 멈춘다."
              INVERTED="$INVERTED $f(V$NUM)"
            fi
          done <<< "$NEW_FILES"

          if [ -n "$INVERTED" ]; then
            {
              echo "## ❌ 마이그레이션 번호 역전 — 배포를 시작하기 전에 멈췄다"
              echo ""
              echo "이 푸시가 들여온 마이그레이션이 직전 \`dev\` 최고 번호(\`V$MAX_BEFORE\`) 이하다:$INVERTED"
              echo ""
              echo "복구 절차는 \`ai/adr/0027-unapplied-migration-rename-exception.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "통과 — 이 푸시의 신규 마이그레이션 전부 V$MAX_BEFORE보다 크다."

      - name: 배포할 이미지 태그 결정
        id: image
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          TAG="$IMAGE_TAG"
          if [ -z "$TAG" ]; then
            TAG="${{ github.sha }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "배포 대상 커밋: $TAG"

      - name: AWS 자격 증명 (OIDC — 장기 액세스 키 없음)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: ECR 로그인
        id: ecr-login
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -o pipefail
          ERROR_FILE=$(mktemp)
          trap 'rm -f "$ERROR_FILE"' EXIT

          if ! TOKEN_ENDPOINT=$(aws ecr get-authorization-token \
            --region "$AWS_REGION" \
            --query 'authorizationData[0].proxyEndpoint' \
            --output text 2>"$ERROR_FILE"); then
            echo "::error::ECR 인증 토큰 조회 실패."
            exit 1
          fi

          case "$TOKEN_ENDPOINT" in
            https://*) REGISTRY=${TOKEN_ENDPOINT#https://} ;;
            *)
              echo "::error::ECR 인증 토큰 응답에서 레지스트리를 확인할 수 없습니다."
              exit 1
              ;;
          esac

          if [ -z "$REGISTRY" ] || [ "$REGISTRY" = "None" ]; then
            echo "::error::ECR 인증 토큰 응답에서 레지스트리를 확인할 수 없습니다."
            exit 1
          fi

          if ! aws ecr get-login-password --region "$AWS_REGION" 2>"$ERROR_FILE" \
            | docker login --username AWS --password-stdin "$REGISTRY" >/dev/null 2>&1; then
            echo "::error::ECR 로그인 실패."
            exit 1
          fi

          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
          echo "ECR 로그인 완료"

      - name: 기존 ECR 커밋 태그 확인
        id: image-lookup
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          ERROR_FILE=$(mktemp)
          trap 'rm -f "$ERROR_FILE"' EXIT

          if DIGEST=$(aws ecr describe-images \
            --repository-name "$REPOSITORY" \
            --image-ids "imageTag=$TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>"$ERROR_FILE"); then
            if [ -z "$DIGEST" ] || [ "$DIGEST" = "None" ]; then
              echo "::error::ECR 태그 조회에 성공했지만 이미지 digest 응답이 비어 있습니다."
              exit 1
            fi

            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "image=$REGISTRY/$REPOSITORY:$TAG" >> "$GITHUB_OUTPUT"
            echo "기존 ECR 커밋 태그를 재사용합니다."
          else
            STATUS=$?
            if grep -q 'ImageNotFoundException' "$ERROR_FILE"; then
              echo "found=false" >> "$GITHUB_OUTPUT"
              echo "커밋 태그가 없어 새 이미지를 빌드합니다."
            else
              echo "::error::ECR 태그 조회 실패(이미지 없음 외의 오류). AWS 권한·네트워크·요청 상태를 확인하세요."
              exit "$STATUS"
            fi
          fi

      - uses: actions/setup-java@v4
        if: steps.image-lookup.outputs.found == 'false'
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: bootJar 빌드
        if: steps.image-lookup.outputs.found == 'false'
        run: ./gradlew bootJar --no-daemon

      - name: 런타임 이미지 빌드 · ECR push (태그 = 커밋 SHA, latest 미사용)
        id: build-push
        if: steps.image-lookup.outputs.found == 'false'
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          IMAGE="$REGISTRY/$REPOSITORY:$TAG"
          if ! docker build --quiet -f Dockerfile.runtime -t "$IMAGE" . >/dev/null 2>&1; then
            echo "::error::런타임 이미지 빌드 실패."
            exit 1
          fi
          if ! docker push --quiet "$IMAGE" >/dev/null 2>&1; then
            echo "::error::런타임 이미지 ECR push 실패."
            exit 1
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "이미지 push 완료"

  # 웹 인스턴스를 한 대씩 순서대로 배포한다. max-parallel: 1이 핵심이다 — 동시에 두 대를 다
  # 내리면 그 순간 서비스가 완전히 죽는다. 한 대씩 처리하면 나머지 한 대가 항상 트래픽을 받는다.
  # fail-fast(기본값)라 한 대가 실패하면 나머지 인스턴스는 건드리지 않고 멈춘다 — 이미 배포된
  # 인스턴스와 안 된 인스턴스가 섞인 상태로 남지만, 최소한 실패를 인지한 상태에서 멈춘다.
  deploy-web:
    needs: build
    runs-on: ubuntu-24.04-arm
    strategy:
      max-parallel: 1
      matrix:
        instance_id: ${{ fromJson(vars.WEB_INSTANCE_IDS) }}
    steps:
      - name: AWS 자격 증명 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: 배포 런타임 파일 확인
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /compose.deploy.yaml
            /deploy/prepare-runtime.sh

      # 이 인스턴스를 ALB에서 뺀다. 아직 처리 중인 요청은 deregistration_delay(타깃 그룹 설정,
      # 30초)만큼 배수구로 흘려보낸 뒤 완전히 빠진다 — 그 전에 컨테이너를 내리면 그 요청들이 끊긴다.
      #
      # describe-target-health가 완전히 빠진 타깃을 조회하면 성공 응답이 아니라 "타깃이 등록돼
      # 있지 않다" 에러를 던진다 — 그래서 API 호출 자체가 실패하는 것과 "타깃이 다 빠졌다"가
      # 같은 모양(둘 다 에러)이 된다. 이 둘을 구분하지 않고 아무 에러나 "다 빠졌다"로 오인하면,
      # 일시적인 스로틀링만으로도 드레이닝이 안 끝난 채 다음 단계(컨테이너 교체)로 넘어가
      # 처리 중이던 요청을 끊는다. 에러 메시지에 "not registered"가 있을 때만 완료로 본다.
      - name: ALB에서 등록 해제 + draining 대기
        run: |
          aws elbv2 deregister-targets \
            --target-group-arn "${{ vars.WEB_TARGET_GROUP_ARN }}" \
            --targets Id=${{ matrix.instance_id }}

          for i in $(seq 1 12); do
            if OUTPUT=$(aws elbv2 describe-target-health \
              --target-group-arn "${{ vars.WEB_TARGET_GROUP_ARN }}" \
              --targets Id=${{ matrix.instance_id }} \
              --query 'TargetHealthDescriptions[0].TargetHealth.State' --output text 2>&1); then
              echo "등록 해제 진행 상태: $OUTPUT ($i/12)"
              if [ "$OUTPUT" = "unused" ] || [ "$OUTPUT" = "None" ]; then
                echo "등록 해제 완료"
                break
              fi
            elif echo "$OUTPUT" | grep -qi "not registered\|not found"; then
              echo "등록 해제 완료 (타깃이 더 이상 그룹에 없음, $i/12)"
              break
            else
              echo "describe-target-health 호출 실패(재시도, $i/12): $OUTPUT"
            fi
            sleep 5
          done

      # 컨테이너 헬스체크 대기까지 같은 원격 스크립트 안에서 수행한다 — 앱 컨테이너는 호스트에
      # 포트를 열지 않으므로(설계) 러너에서 직접 curl로 확인할 수 없다.
      #
      # 새 이미지가 healthy가 안 되면 .env에 남아 있던 이전 APP_IMAGE로 되돌린다 — 예전
      # 블루-그린은 새 색이 실패해도 이전 색이 그대로 살아 있어 자동으로 안전했는데, 롤링
      # 배포는 같은 인스턴스에서 컨테이너를 그 자리에서 교체하기 때문에 그 안전장치가 없다.
      # 롤백에 성공해도 이 SSM 명령 자체는 실패(exit 1)로 끝낸다 — "배포가 실제로는 안 나갔다"는
      # 사실을 job 실패로 드러내되, 인스턴스는 동작하는 이전 버전으로 남겨 둔다.
      - name: 이미지 교체 + 컨테이너 헬스체크 대기 (SSM)
        id: ssm-deploy
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          COMPOSE_B64=$(base64 -w 0 compose.deploy.yaml)
          PREPARE_RUNTIME_B64=$(base64 -w 0 deploy/prepare-runtime.sh)
          cat > deploy-remote.sh <<SCRIPT
          set -e
          cd /home/ec2-user/finplay
          printf '%s' '$COMPOSE_B64' | base64 -d > compose.deploy.yaml
          printf '%s' '$PREPARE_RUNTIME_B64' | base64 -d > /opt/finplay/prepare-runtime.sh
          chmod 700 /opt/finplay/prepare-runtime.sh
          /opt/finplay/prepare-runtime.sh web "$AWS_REGION"
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin \$(echo "$IMAGE" | cut -d/ -f1)
          docker image prune -af || true

          PREVIOUS_IMAGE=\$(grep -m1 '^APP_IMAGE=' .env | cut -d= -f2-)
          if ! docker pull "$IMAGE" >/dev/null 2>&1; then
            echo "새 이미지 pull 실패 — 기존 서비스와 APP_IMAGE를 유지한다"
            exit 1
          fi

          rollback() {
            if [ -z "\$PREVIOUS_IMAGE" ]; then
              echo "이전 APP_IMAGE가 없어 자동 롤백할 수 없다"
              return 1
            fi

            echo "이전 이미지로 롤백한다"
            sed -i "s|^APP_IMAGE=.*|APP_IMAGE=\$PREVIOUS_IMAGE|" .env
            if ! docker image inspect "\$PREVIOUS_IMAGE" >/dev/null 2>&1; then
              docker pull "\$PREVIOUS_IMAGE" >/dev/null 2>&1 || {
                echo "이전 이미지를 pull하지 못했다"
                return 1
              }
            fi
            if ! docker compose -f compose.deploy.yaml up -d; then
              echo "이전 이미지 컨테이너 시작에 실패했다"
              return 1
            fi
            for i in \$(seq 1 24); do
              STATUS=\$(docker inspect --format '{{.State.Health.Status}}' finplay-app 2>/dev/null || echo starting)
              echo "롤백 컨테이너 헬스체크: \$STATUS (\$i/24)"
              if [ "\$STATUS" = "healthy" ]; then
                echo "롤백한 이전 이미지가 healthy"
                return 0
              fi
              sleep 5
            done
            echo "이전 이미지가 healthy 상태가 되지 않았다"
            return 1
          }

          sed -i "s|^APP_IMAGE=.*|APP_IMAGE=$IMAGE|" .env
          if ! docker compose -f compose.deploy.yaml up -d; then
            echo "새 컨테이너 시작 실패 — 이전 이미지로 복원한다"
            rollback || true
            exit 1
          fi

          for i in \$(seq 1 36); do
            STATUS=\$(docker inspect --format '{{.State.Health.Status}}' finplay-app 2>/dev/null || echo starting)
            echo "컨테이너 헬스체크: \$STATUS (\$i/36)"
            if [ "\$STATUS" = "healthy" ]; then
              echo "컨테이너 healthy"
              exit 0
            fi
            if [ "\$STATUS" = "unhealthy" ]; then
              echo "컨테이너 unhealthy로 판정됨"
              docker logs finplay-app 2>&1 | grep -A 40 -E "APPLICATION FAILED TO START|Error creating bean|Caused by:|FlywayValidateException|Detected resolved migration" | tail -c 2000 || true
              break
            fi
            sleep 5
          done

          if [ "\$STATUS" != "healthy" ]; then
            echo "타임아웃 또는 unhealthy — 3분 안에 healthy가 되지 않았다"
            docker logs finplay-app 2>&1 | grep -A 40 -E "APPLICATION FAILED TO START|Error creating bean|Caused by:|FlywayValidateException|Detected resolved migration" | tail -c 2000 || true

            if [ -n "\$PREVIOUS_IMAGE" ]; then
              rollback || true
            else
              echo "롤백할 이전 이미지가 없다(최초 배포로 추정) — 이 인스턴스는 컨테이너가 없는 상태로 남는다"
            fi
            exit 1
          fi
          SCRIPT

          jq -n --rawfile script deploy-remote.sh '{commands: ($script | rtrimstr("\n") | split("\n"))}' > ssm-params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ matrix.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-params.json \
            --query 'Command.CommandId' --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "SSM 명령 전송됨: $CMD_ID"

      - name: SSM 명령 결과 대기 · 판독
        run: |
          CMD_ID="${{ steps.ssm-deploy.outputs.command_id }}"
          INSTANCE_ID="${{ matrix.instance_id }}"
          STATUS="Pending"

          for i in $(seq 1 50); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "SSM 명령 상태: $STATUS ($i/50)"
            if [ "$STATUS" != "Pending" ] && [ "$STATUS" != "InProgress" ] && [ "$STATUS" != "Delayed" ]; then
              break
            fi
          done

          echo "--- stdout ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text | tee ssm-stdout.txt
          echo "--- stderr ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text | tee ssm-stderr.txt

          if grep -qE "Detected resolved migration not applied to database|FlywayValidateException|Migrations have failed validation" ssm-stdout.txt ssm-stderr.txt; then
            DETAIL=$(grep -hoE "Detected resolved migration not applied to database: [0-9]+" ssm-stdout.txt ssm-stderr.txt | head -1 || true)
            DETAIL=${DETAIL:-"Flyway validate 실패 (자세한 문장은 위 stdout 참고)"}
            echo "::error::원인은 Flyway 마이그레이션이다 — $DETAIL."
          fi

          if [ "$STATUS" != "Success" ]; then
            echo "::error::SSM 명령 실패 — 이전 이미지로 롤백을 시도했을 수 있다(위 stdout 참고). 다음 단계에서 이 인스턴스를 다시 ALB에 등록한다."
            exit 1
          fi

      # if: always() — 앞 단계가 실패했어도(롤백됐든 안 됐든) 이 인스턴스를 ALB에서 영영
      # 빼놓지 않는다. 컨테이너가 실제로 unhealthy면 ALB 자체가 트래픽을 안 보내므로 안전하고,
      # 롤백이 성공했다면(이전 이미지가 healthy) 그 상태로 트래픽을 다시 받을 수 있다 — 등록
      # 해제된 채로 방치되는 것보다 항상 낫다.
      - name: ALB에 재등록 + healthy 대기
        if: always()
        run: |
          aws elbv2 register-targets \
            --target-group-arn "${{ vars.WEB_TARGET_GROUP_ARN }}" \
            --targets Id=${{ matrix.instance_id }}

          for i in $(seq 1 24); do
            if STATE=$(aws elbv2 describe-target-health \
              --target-group-arn "${{ vars.WEB_TARGET_GROUP_ARN }}" \
              --targets Id=${{ matrix.instance_id }} \
              --query 'TargetHealthDescriptions[0].TargetHealth.State' --output text 2>&1); then
              echo "ALB 타깃 상태: $STATE ($i/24)"
              if [ "$STATE" = "healthy" ]; then
                echo "재등록 완료 — 이 인스턴스는 다시 트래픽을 받는다"
                exit 0
              fi
            else
              echo "describe-target-health 호출 실패(재시도, $i/24): $STATE"
            fi
            sleep 10
          done
          echo "::error::타임아웃 — 재등록 후 healthy가 되지 않았다. 인스턴스는 등록은 됐지만(ALB가 헬스체크로 트래픽을 막음) 컨테이너 상태를 SSM으로 직접 확인해야 한다."
          exit 1

  # 스케줄러 인스턴스는 ALB에 없으므로 등록 해제·재등록·타깃 헬스체크가 필요 없다.
  # 배포 실패해도 트래픽 서빙에는 영향이 없다(스케줄 배치·빗썸 피드만 잠시 멈출 뿐이다).
  deploy-scheduler:
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - name: AWS 자격 증명 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: 배포 런타임 파일 확인
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /compose.deploy.yaml
            /deploy/prepare-runtime.sh

      # 스케줄러는 ALB 대상이 아니라 재등록 안전장치가 없다 — 그래서 롤백 자체가 더 중요하다.
      # deploy-web과 동일한 롤백 로직(이전 APP_IMAGE로 되돌림)을 그대로 쓴다.
      - name: 이미지 교체 + 컨테이너 헬스체크 대기 (SSM)
        id: ssm-deploy
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          COMPOSE_B64=$(base64 -w 0 compose.deploy.yaml)
          PREPARE_RUNTIME_B64=$(base64 -w 0 deploy/prepare-runtime.sh)
          cat > deploy-remote.sh <<SCRIPT
          set -e
          cd /home/ec2-user/finplay
          printf '%s' '$COMPOSE_B64' | base64 -d > compose.deploy.yaml
          printf '%s' '$PREPARE_RUNTIME_B64' | base64 -d > /opt/finplay/prepare-runtime.sh
          chmod 700 /opt/finplay/prepare-runtime.sh
          /opt/finplay/prepare-runtime.sh scheduler "$AWS_REGION"
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin \$(echo "$IMAGE" | cut -d/ -f1)
          docker image prune -af || true

          PREVIOUS_IMAGE=\$(grep -m1 '^APP_IMAGE=' .env | cut -d= -f2-)
          if ! docker pull "$IMAGE" >/dev/null 2>&1; then
            echo "새 이미지 pull 실패 — 기존 서비스와 APP_IMAGE를 유지한다"
            exit 1
          fi

          rollback() {
            if [ -z "\$PREVIOUS_IMAGE" ]; then
              echo "이전 APP_IMAGE가 없어 자동 롤백할 수 없다"
              return 1
            fi

            echo "이전 이미지로 롤백한다"
            sed -i "s|^APP_IMAGE=.*|APP_IMAGE=\$PREVIOUS_IMAGE|" .env
            if ! docker image inspect "\$PREVIOUS_IMAGE" >/dev/null 2>&1; then
              docker pull "\$PREVIOUS_IMAGE" >/dev/null 2>&1 || {
                echo "이전 이미지를 pull하지 못했다"
                return 1
              }
            fi
            if ! docker compose -f compose.deploy.yaml up -d; then
              echo "이전 이미지 컨테이너 시작에 실패했다"
              return 1
            fi
            for i in \$(seq 1 24); do
              STATUS=\$(docker inspect --format '{{.State.Health.Status}}' finplay-app 2>/dev/null || echo starting)
              echo "롤백 컨테이너 헬스체크: \$STATUS (\$i/24)"
              if [ "\$STATUS" = "healthy" ]; then
                echo "롤백한 이전 이미지가 healthy"
                return 0
              fi
              sleep 5
            done
            echo "이전 이미지가 healthy 상태가 되지 않았다"
            return 1
          }

          sed -i "s|^APP_IMAGE=.*|APP_IMAGE=$IMAGE|" .env
          if ! docker compose -f compose.deploy.yaml up -d; then
            echo "새 컨테이너 시작 실패 — 이전 이미지로 복원한다"
            rollback || true
            exit 1
          fi

          for i in \$(seq 1 36); do
            STATUS=\$(docker inspect --format '{{.State.Health.Status}}' finplay-app 2>/dev/null || echo starting)
            echo "컨테이너 헬스체크: \$STATUS (\$i/36)"
            if [ "\$STATUS" = "healthy" ]; then
              exit 0
            fi
            if [ "\$STATUS" = "unhealthy" ]; then
              docker logs finplay-app 2>&1 | grep -A 40 -E "APPLICATION FAILED TO START|Error creating bean|Caused by:|FlywayValidateException|Detected resolved migration" | tail -c 2000 || true
              break
            fi
            sleep 5
          done

          if [ "\$STATUS" != "healthy" ]; then
            echo "타임아웃 또는 unhealthy — 3분 안에 healthy가 되지 않았다"
            docker logs finplay-app 2>&1 | grep -A 40 -E "APPLICATION FAILED TO START|Error creating bean|Caused by:|FlywayValidateException|Detected resolved migration" | tail -c 2000 || true

            if [ -n "\$PREVIOUS_IMAGE" ]; then
              rollback || true
            else
              echo "롤백할 이전 이미지가 없다(최초 배포로 추정)"
            fi
            exit 1
          fi
          SCRIPT

          jq -n --rawfile script deploy-remote.sh '{commands: ($script | rtrimstr("\n") | split("\n"))}' > ssm-params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.SCHEDULER_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-params.json \
            --query 'Command.CommandId' --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"

      - name: SSM 명령 결과 대기 · 판독
        run: |
          CMD_ID="${{ steps.ssm-deploy.outputs.command_id }}"
          INSTANCE_ID="${{ vars.SCHEDULER_INSTANCE_ID }}"
          STATUS="Pending"

          for i in $(seq 1 50); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "SSM 명령 상태: $STATUS ($i/50)"
            if [ "$STATUS" != "Pending" ] && [ "$STATUS" != "InProgress" ] && [ "$STATUS" != "Delayed" ]; then
              break
            fi
          done

          echo "--- stdout ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text | tee ssm-stdout.txt
          echo "--- stderr ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text | tee ssm-stderr.txt

          if grep -qE "Detected resolved migration not applied to database|FlywayValidateException|Migrations have failed validation" ssm-stdout.txt ssm-stderr.txt; then
            DETAIL=$(grep -hoE "Detected resolved migration not applied to database: [0-9]+" ssm-stdout.txt ssm-stderr.txt | head -1 || true)
            DETAIL=${DETAIL:-"Flyway validate 실패 (자세한 문장은 위 stdout 참고)"}
            echo "::error::원인은 Flyway 마이그레이션이다 — $DETAIL."
          fi

          if [ "$STATUS" != "Success" ]; then
            echo "::error::스케줄러 인스턴스 배포 실패 — 이전 이미지로 롤백을 시도했을 수 있다(위 stdout 참고)"
            exit 1
          fi

  summary:
    needs: [build, deploy-web, deploy-scheduler]
    if: always()
    runs-on: ubuntu-24.04-arm
    steps:
      - name: 배포 요약
        run: |
          {
            echo "### 배포 결과"
            echo "- 배포 커밋: \`${{ needs.build.outputs.tag }}\`"
            echo "- 웹 인스턴스 롤링 배포: \`${{ needs.deploy-web.result }}\`"
            echo "- 스케줄러 배포: \`${{ needs.deploy-scheduler.result }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
