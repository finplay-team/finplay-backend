# infra/terraform/의 문법·타입을 PR 단계에서 검증한다 (ADR-0030, PR #569 리뷰 권장사항).
# terraform fmt/init/validate는 AWS 자격 증명이 필요 없다 — plan·apply와 달리 실제 계정
# 상태를 조회하지 않고 코드 자체의 문법·리소스 그래프만 확인하기 때문이다.
name: Terraform CI

on:
  pull_request:
    branches: [dev, main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 문서·Java 코드만 바뀐 PR은 아래 스텝을 건너뛴다 — 워크플로우 자체는 항상 실행되어
      # 브랜치 보호 규칙의 required status check로 쓸 수 있게 한다(ci.yml과 같은 이유로
      # paths-filter를 쓰지 트리거 자체를 paths:로 제한하지 않는다).
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            terraform:
              - 'infra/terraform/**'

      - uses: hashicorp/setup-terraform@v3
        if: steps.filter.outputs.terraform == 'true'
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: terraform fmt -check
        if: steps.filter.outputs.terraform == 'true'
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - name: terraform init (backend 없이 — 문법 검증만 목적)
        if: steps.filter.outputs.terraform == 'true'
        working-directory: infra/terraform
        run: terraform init -backend=false

      - name: terraform validate
        if: steps.filter.outputs.terraform == 'true'
        working-directory: infra/terraform
        run: terraform validate
